apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: movie-booking
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/rakeshnaini1552/frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: frontend-config
            # AUTH_SECRET and AUTH_KEYCLOAK_SECRET, created by deploy/k8s/create-secrets.sh.
            - secretRef:
                name: frontend-auth
          resources:
            requests:
              memory: 192Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          # /api/health answers without calling the gateway, so a gateway outage does not make
          # Kubernetes restart healthy frontend pods.
          startupProbe:
            httpGet:
              path: /api/health
              port: 3001
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
