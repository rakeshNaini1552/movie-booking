apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: movie-booking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy
  namespace: movie-booking
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy
  namespace: movie-booking
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: movie-booking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy
