# A PodDisruptionBudget limits voluntary evictions (node drain, cluster upgrade): at least one pod of
# the service must stay Ready. With one replica it blocks a drain until the pod is scaled up or the
# budget is removed, so it only protects a service that runs two or more replicas.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: seat-service
  namespace: movie-booking
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: seat-service
---
