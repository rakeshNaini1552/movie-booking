apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-service-config
  namespace: movie-booking
data:
  CATALOG_DB_HOST: host.docker.internal
  CATALOG_DB_PORT: "5436"
  CATALOG_DB_NAME: catalog_db
  KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/movie-booking
  OTEL_TRACES_ENDPOINT: http://host.docker.internal:4318/v1/traces
  LOG_DIR: /tmp/logs
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
