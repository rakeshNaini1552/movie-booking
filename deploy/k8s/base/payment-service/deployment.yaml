apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: movie-booking
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: payment-service
          image: ghcr.io/rakeshnaini1552/payment-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: payment-service-config
            - secretRef:
                name: payment-service-db
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            timeoutSeconds: 5
            failureThreshold: 6
