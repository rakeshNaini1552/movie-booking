# Ingress only. Everything is denied by default; each policy below lists who may reach a service.
# Egress is not restricted (the services reach Postgres, Kafka, Redis and Keycloak on the Mac through
# host.docker.internal). The frontend has no allow rule: it is reached through kubectl port-forward,
# which does not pass through NetworkPolicy. Probes come from the kubelet on the node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: movie-booking
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-seat-service
  namespace: movie-booking
spec:
  podSelector:
    matchLabels:
      app: seat-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: booking-service
        - podSelector:
            matchLabels:
              app: gateway-service
        - podSelector:
            matchLabels:
              app: alloy
      ports:
        - port: 8081
---
apiVersion: networking.k8s.io/v1
