apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: movie-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ticket-service
          image: ghcr.io/rakeshnaini1552/ticket-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: ticket-service-config
            - secretRef:
                name: ticket-service-db
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 60
