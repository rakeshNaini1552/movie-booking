apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: movie-booking-stage
resources:
  - ../../base
  - namespace.yaml
images:
  - name: ghcr.io/rakeshnaini1552/seat-service
    newTag: 75c6b8211dbbda7656d6bead0f45e137375e3b7b
  - name: ghcr.io/rakeshnaini1552/booking-service
    newTag: 75c6b8211dbbda7656d6bead0f45e137375e3b7b
  - name: ghcr.io/rakeshnaini1552/payment-service
    newTag: 75c6b8211dbbda7656d6bead0f45e137375e3b7b
  - name: ghcr.io/rakeshnaini1552/ticket-service
    newTag: 75c6b8211dbbda7656d6bead0f45e137375e3b7b
  - name: ghcr.io/rakeshnaini1552/gateway-service
    newTag: 5c4736c636096ab8f15a9a96219f4ae8c6154dd2
  - name: ghcr.io/rakeshnaini1552/catalog-service
    newTag: 75c6b8211dbbda7656d6bead0f45e137375e3b7b
  # The bump workflow edits the line right after the name, so this comment stays above it.
  # newTag is replaced by the first bump PR after the frontend image is published.
  - name: ghcr.io/rakeshnaini1552/frontend
    newTag: pending-first-publish
patches:
  - target:
      kind: ConfigMap
      name: seat-service-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: seat-service-config
      data:
        TRACING_SAMPLING: "0.1"
        SEAT_DB_NAME: seat_db_stage
        SPRING_DATA_REDIS_DATABASE: "1"
        BOOKING_EVENTS_TOPIC: booking-events-stage
        BOOKING_EVENTS_DLT_TOPIC: booking-events-dlt-stage
        KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/movie-booking-stage
  - target:
      kind: ConfigMap
      name: booking-service-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: booking-service-config
      data:
        TRACING_SAMPLING: "0.1"
        DB_NAME: booking_db_stage
        BOOKING_EVENTS_TOPIC: booking-events-stage
        TICKET_EVENTS_TOPIC: ticket-events-stage
        KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/movie-booking-stage
  - target:
      kind: ConfigMap
      name: payment-service-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: payment-service-config
      data:
        TRACING_SAMPLING: "0.1"
        DB_NAME: payment_db_stage
        BOOKING_EVENTS_TOPIC: booking-events-stage
        BOOKING_EVENTS_DLT_TOPIC: booking-events-dlt-stage
        KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/movie-booking-stage
  - target:
      kind: ConfigMap
      name: ticket-service-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ticket-service-config
      data:
        TRACING_SAMPLING: "0.1"
        TICKET_DB_NAME: ticket_db_stage
        BOOKING_EVENTS_TOPIC: booking-events-stage
        BOOKING_EVENTS_DLT_TOPIC: booking-events-dlt-stage
        TICKET_EVENTS_TOPIC: ticket-events-stage
        KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/movie-booking-stage
  - target:
      kind: ConfigMap
      name: gateway-service-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gateway-service-config
      data:
        KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/movie-booking-stage
  - target:
      kind: ConfigMap
      name: catalog-service-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: catalog-service-config
      data:
        TRACING_SAMPLING: "0.1"
        CATALOG_DB_NAME: catalog_db_stage
        CATALOG_CACHE_PREFIX: "catalog-stage:"
        KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/movie-booking-stage
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      kind: ConfigMap
      name: frontend-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: frontend-config
      data:
        KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/movie-booking-stage
        # Stage is port-forwarded on its own port so both environments can be open at once.
        AUTH_URL: http://localhost:3002
        OTEL_SERVICE_NAME: frontend-stage
