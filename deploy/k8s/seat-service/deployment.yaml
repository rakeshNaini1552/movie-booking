apiVersion: apps/v1
kind: Deployment
metadata:
  name: seat-service
  namespace: movie-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seat-service
  template:
    metadata:
      labels:
        app: seat-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: seat-service
          image: ghcr.io/rakeshnaini1552/seat-service:6308e0fb85eca3e348d7ea7962796e9c98cef347
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: seat-service-config
            - secretRef:
                name: seat-service-db
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
