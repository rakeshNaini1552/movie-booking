apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: booking-service
  namespace: movie-booking
  annotations:
    konghq.com/plugins: correlation-id,jwt,rate-limiting
spec:
  parentRefs:
    - name: kong
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/bookings
      backendRefs:
        - name: booking-service
          port: 8082