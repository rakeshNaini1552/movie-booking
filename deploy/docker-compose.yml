services:
  seat-redis:
    image: redis:7-alpine
    ports:
      - "${SEAT_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5
  seat-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${SEAT_DB_NAME}
      POSTGRES_USER: ${SEAT_DB_USER}
      POSTGRES_PASSWORD: ${SEAT_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  booking-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${BOOKING_DB_NAME}
      POSTGRES_USER: ${BOOKING_DB_USER}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD}
    ports:
      - "${BOOKING_DB_PORT:-5433}:5432"
    volumes:
      - booking-pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  booking-pgdata: