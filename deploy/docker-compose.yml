services:

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  seat-redis:
    image: redis:7-alpine
    ports:
      - "${SEAT_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5
  seat-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${SEAT_DB_NAME}
      POSTGRES_USER: ${SEAT_DB_USER}
      POSTGRES_PASSWORD: ${SEAT_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  booking-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${BOOKING_DB_NAME}
      POSTGRES_USER: ${BOOKING_DB_USER}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD}
    ports:
      - "${BOOKING_DB_PORT:-5433}:5432"
    volumes:
      - booking-pgdata:/var/lib/postgresql/data
  payment-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "${PAYMENT_DB_PORT:-5434}:5432"
    volumes:
      - payment-pgdata:/var/lib/postgresql/data
  ticket-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${TICKET_DB_NAME}
      POSTGRES_USER: ${TICKET_DB_USER}
      POSTGRES_PASSWORD: ${TICKET_DB_PASSWORD}
    ports:
      - "${TICKET_DB_PORT:-5435}:5432"
    volumes:
      - ticket-pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  booking-pgdata:
  payment-pgdata:
  ticket-pgdata:
