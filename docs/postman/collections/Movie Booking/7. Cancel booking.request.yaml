$kind: http-request
url: "{{bookingServiceUrl}}/api/v1/bookings/{{bookingId}}/cancel"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('status is CANCELLED', () => pm.expect(pm.response.json().status).to.eql('CANCELLED'));
