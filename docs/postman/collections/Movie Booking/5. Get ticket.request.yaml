$kind: http-request
url: "{{ticketServiceUrl}}/tickets/{{ticketId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('ticketId matches', () => pm.expect(pm.response.json().ticketId).to.eql(pm.environment.get('ticketId')));
    language: text/javascript
order: 5000
