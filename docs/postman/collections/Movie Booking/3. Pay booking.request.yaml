$kind: http-request
url: "{{bookingServiceUrl}}/api/v1/bookings/{{bookingId}}/payments"
method: POST
headers:
  Idempotency-Key: "{{idempotencyKey}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "paymentToken": "{{paymentToken}}"
    }
scripts:
  - type: beforeRequest
    code: pm.environment.set('idempotencyKey', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('booking status is CONFIRMED', () => pm.expect(b.status).to.eql('CONFIRMED'));
      pm.test('payment status is SUCCESS', () => pm.expect(b.paymentStatus).to.eql('SUCCESS'));
    language: text/javascript
order: 3000
