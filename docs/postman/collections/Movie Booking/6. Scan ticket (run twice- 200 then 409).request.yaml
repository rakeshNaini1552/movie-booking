$kind: http-request
name: "6. Scan ticket (run twice: 200 then 409)"
url: "{{ticketServiceUrl}}/tickets/{{ticketId}}/scan"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "payload": "{{qrPayload}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('first scan 200, repeat scan 409', () => pm.expect(pm.response.code).to.be.oneOf([200, 409]));
    language: text/javascript
order: 6000
