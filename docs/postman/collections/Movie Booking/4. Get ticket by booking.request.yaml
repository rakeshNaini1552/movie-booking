$kind: http-request
url: "{{ticketServiceUrl}}/tickets/by-booking/{{bookingId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('ticket is ISSUED', () => pm.expect(b.status).to.eql('ISSUED'));
      pm.environment.set('ticketId', b.ticketId);
      pm.environment.set('qrPayload', b.qrPayload);
    language: text/javascript
order: 4000
