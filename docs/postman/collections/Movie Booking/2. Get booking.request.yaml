$kind: http-request
url: "{{bookingServiceUrl}}/api/v1/bookings/{{bookingId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.environment.set('amount', b.totalAmount);
    language: text/javascript
order: 2000
