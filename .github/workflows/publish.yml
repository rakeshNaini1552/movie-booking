name: publish

on:
  push:
    branches: [main]
    paths-ignore: ['deploy/**']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [booking-service, seat-service, payment-service, ticket-service, gateway-service, catalog-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -DskipTests spring-boot:build-image -Dspring-boot.build-image.imageName=$IMAGE

      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          fail-build: false
          output-format: table

      - name: Push image
        run: docker push $IMAGE

  bump-tags:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BUMP_PR_TOKEN }}

      - name: Open PR bumping overlay tags
        env:
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.BUMP_PR_TOKEN }}
        run: |
          set -euo pipefail
          OVERLAYS="deploy/k8s/overlays/local/kustomization.yaml deploy/k8s/overlays/stage/kustomization.yaml"
          SERVICES="booking-service seat-service payment-service ticket-service gateway-service catalog-service"

          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "No previous commit to compare against; skipping tag bump."
            exit 0
          fi

          changed=()
          for service in $SERVICES; do
            if ! git diff --quiet "$BEFORE" "$SHA" -- "services/$service"; then
              changed+=("$service")
            fi
          done

          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No service code changed; no PR needed."
            exit 0
          fi

          bumped=()
          for overlay in $OVERLAYS; do
            expected=0
            for service in "${changed[@]}"; do
              current="$(awk -v name="ghcr.io/rakeshnaini1552/${service}" '$0 == "  - name: " name { getline; print $2; exit }' "$overlay")"
              if [[ "$current" != "$SHA" ]]; then
                expected=$((expected + 1))
              fi
              sed -i "/- name: ghcr.io\/rakeshnaini1552\/${service}\$/{n;s/newTag: .*/newTag: ${SHA}/;}" "$overlay"
            done

            added=0 removed=0
            read -r added removed _ < <(git diff --numstat -- "$overlay") || true
            if [[ "${added:-0}" -ne "$expected" || "${removed:-0}" -ne "$expected" ]]; then
              echo "Expected $expected changed line(s) in $overlay, got +${added:-0} -${removed:-0}" >&2
              git diff -- "$overlay" >&2
              exit 1
            fi
            if [[ "$expected" -gt 0 ]]; then
              bumped+=("$overlay")
            fi
          done

          if [[ ${#bumped[@]} -eq 0 ]]; then
            echo "Every changed service already uses $SHA in both overlays; no PR needed."
            exit 0
          fi

          short="${SHA:0:7}"
          list="$(IFS=,; echo "${changed[*]}")"
          branch="bump-tags-$short"
          title="Bump local and stage overlay image tags to $short ($list)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "${bumped[@]}"
          git commit -m "$title"
          git push origin "$branch"

          body="Bumps the image tag in both the local and the stage overlay for the services whose code changed in this push:"$'\n\n'
          for service in "${changed[@]}"; do
            body+="- $service"$'\n'
          done
          body+=$'\n'"Tag: \`$SHA\`"$'\n\n'"Overlays: "
          for overlay in "${bumped[@]}"; do
            body+="\`$overlay\` "
          done
          body+=$'\n\n'"Merging this PR deploys the local overlay through Argo CD. The stage overlay is updated in git but is applied by hand (kubectl apply -k deploy/k8s/overlays/stage) until a stage Application exists."
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
