name: publish

on:
  push:
    branches: [main]
    paths-ignore: ['deploy/**']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [booking-service, seat-service, payment-service, ticket-service, gateway-service, catalog-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -DskipTests spring-boot:build-image -Dspring-boot.build-image.imageName=$IMAGE

      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          fail-build: false
          output-format: table

      - name: Push image
        run: docker push $IMAGE

  bump-tags:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BUMP_PR_TOKEN }}

      - name: Open PR bumping local overlay tags
        env:
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.BUMP_PR_TOKEN }}
        run: |
          set -euo pipefail
          OVERLAY=deploy/k8s/overlays/local/kustomization.yaml
          SERVICES="booking-service seat-service payment-service ticket-service gateway-service catalog-service"

          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "No previous commit to compare against; skipping tag bump."
            exit 0
          fi

          changed=()
          for service in $SERVICES; do
            if ! git diff --quiet "$BEFORE" "$SHA" -- "services/$service"; then
              changed+=("$service")
            fi
          done

          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No service code changed; no PR needed."
            exit 0
          fi

          for service in "${changed[@]}"; do
            sed -i "/- name: ghcr.io\/rakeshnaini1552\/${service}\$/{n;s/newTag: .*/newTag: ${SHA}/;}" "$OVERLAY"
          done

          read -r added removed _ < <(git diff --numstat -- "$OVERLAY")
          if [[ "${added:-0}" -ne ${#changed[@]} || "${removed:-0}" -ne ${#changed[@]} ]]; then
            echo "Expected ${#changed[@]} changed line(s) in $OVERLAY, got +${added:-0} -${removed:-0}" >&2
            git diff -- "$OVERLAY" >&2
            exit 1
          fi

          short="${SHA:0:7}"
          list="$(IFS=,; echo "${changed[*]}")"
          branch="bump-local-tags-$short"
          title="Bump local overlay image tags to $short ($list)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$OVERLAY"
          git commit -m "$title"
          git push origin "$branch"

          body="Bumps the local overlay image tag for the services whose code changed in this push:"$'\n\n'
          for service in "${changed[@]}"; do
            body+="- $service"$'\n'
          done
          body+=$'\n'"Tag: \`$SHA\`"$'\n\n'"The stage overlay is not changed. Merging this PR deploys the new tags to the local environment through Argo CD."
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
