name: ci

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [booking-service, seat-service, payment_service, ticket-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: ./mvnw test