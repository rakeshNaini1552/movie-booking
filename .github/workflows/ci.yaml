name: ci

on:
  pull_request:

jobs:
  booking-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        working-directory: services/booking-service
        run: ./mvnw test