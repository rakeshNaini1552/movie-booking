spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_db}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

booking:
  pricing:
    seat-price: ${BOOKING_SEAT_PRICE:250.00}
  expiry:
    enabled: ${BOOKING_EXPIRY_ENABLED:true}
    poll-interval-ms: ${BOOKING_EXPIRY_POLL_MS:60000}
    pending-timeout: ${BOOKING_EXPIRY_PENDING_TIMEOUT:10m}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

resilience4j:
  retry:
    instances:
      seatService:
        max-attempts: ${SEAT_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${SEAT_RETRY_WAIT:200ms}
        retry-exceptions:
          - com.movie.booking.booking_service.exception.SeatServiceUnavailableException
  circuitbreaker:
    instances:
      seatService:
        sliding-window-size: ${SEAT_CB_WINDOW:10}
        minimum-number-of-calls: ${SEAT_CB_MIN_CALLS:5}
        failure-rate-threshold: ${SEAT_CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${SEAT_CB_OPEN_WAIT:10s}
        permitted-number-of-calls-in-half-open-state: ${SEAT_CB_HALF_OPEN_CALLS:3}
        record-exceptions:
          - com.movie.booking.booking_service.exception.SeatServiceUnavailableException

seat-service:
  base-url: ${SEAT_SERVICE_URL:http://localhost:8081}
  connect-timeout-ms: ${SEAT_SERVICE_CONNECT_TIMEOUT_MS:500}
  read-timeout-ms: ${SEAT_SERVICE_READ_TIMEOUT_MS:2000}

payment-service:
  base-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  connect-timeout-ms: ${PAYMENT_SERVICE_CONNECT_TIMEOUT_MS:500}
  read-timeout-ms: ${PAYMENT_SERVICE_READ_TIMEOUT_MS:2000}