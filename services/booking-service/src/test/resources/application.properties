booking.outbox.publisher.enabled=false

spring.security.oauth2.client.registration.booking-service.client-secret=test-client-secret
logging.file.name=target/test-logs/app.log

# No Keycloak in tests: point the registration at a provider with explicit endpoints, so no issuer discovery call is made
spring.security.oauth2.client.registration.booking-service.provider=test-keycloak
spring.security.oauth2.client.provider.test-keycloak.token-uri=http://localhost:0/test/token
spring.security.oauth2.client.provider.test-keycloak.authorization-uri=http://localhost:0/test/auth
spring.security.oauth2.client.provider.test-keycloak.jwk-set-uri=http://localhost:0/test/certs
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:0/test/certs
