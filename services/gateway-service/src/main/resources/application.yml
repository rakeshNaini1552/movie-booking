spring:
  application:
    name: gateway-service
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/movie-booking}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${GATEWAY_REDIS_TIMEOUT_MS:1000}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            # Must stay above booking-service's worst case for POST /{id}/payments (see PAYMENT_* and DB_CONNECTION_TIMEOUT_MS there).
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:20000}
          routes:
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/bookings/**
              filters:
                - AddRequestHeader=X-Gateway, spring
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE_REPLENISH:5}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_BURST:10}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: ticket-service
              uri: ${TICKET_SERVICE_URL:http://localhost:8084}
              # Read-only ticket lookups. The staff scan endpoint (POST /tickets/{id}/scan) is not exposed here.
              predicates:
                - Path=/api/v1/tickets/**
                - Method=GET
              filters:
                - AddRequestHeader=X-Gateway, spring
                - RewritePath=/api/v1/tickets/(?<segment>.*), /tickets/$\{segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE_REPLENISH:5}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_BURST:10}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: seat-service
              uri: ${SEAT_SERVICE_URL:http://localhost:8081}
              # Read-only seat map only. Holds, releases and every other seat-service endpoint stay
              # internal (booking-service calls them directly). This route must come before
              # catalog-service, whose /api/v1/shows/** would otherwise take this path.
              predicates:
                - Path=/api/v1/shows/*/seats
                - Method=GET
              filters:
                - AddRequestHeader=X-Gateway, spring
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE_REPLENISH:5}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_BURST:10}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/movies/**,/api/v1/theaters/**,/api/v1/shows/**,/graphql
              filters:
                - AddRequestHeader=X-Gateway, spring
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${GATEWAY_RATE_REPLENISH:5}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_BURST:10}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
server:
  port: 8090