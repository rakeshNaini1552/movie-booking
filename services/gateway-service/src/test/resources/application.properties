# No Keycloak in tests: an explicit jwk-set-uri takes precedence over issuer-uri, so no discovery call is made at startup
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:0/test/certs
# Unreachable downstream, so a request that passes the gateway filter fails after authentication
BOOKING_SERVICE_URL=http://localhost:1

# Small limit so the rate limit integration test trips quickly
GATEWAY_RATE_REPLENISH=1
GATEWAY_RATE_BURST=2
