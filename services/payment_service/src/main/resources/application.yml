spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true


server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

