spring:
  application:
    name: seat-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seat_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

seat:
  hold:
    ttl: ${SEAT_HOLD_TTL:5m}
    expiry:
      enabled: ${SEAT_HOLD_EXPIRY_ENABLED:true}
      poll-interval: ${SEAT_HOLD_EXPIRY_POLL_INTERVAL:PT5S}
      batch-size: ${SEAT_HOLD_EXPIRY_BATCH_SIZE:100}
      lock-at-most-for: ${SEAT_HOLD_EXPIRY_LOCK_AT_MOST_FOR:PT1M}
      lock-at-least-for: ${SEAT_HOLD_EXPIRY_LOCK_AT_LEAST_FOR:PT1S}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info