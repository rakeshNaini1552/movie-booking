spring:
  application:
    name: seat-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${SEAT_DB_HOST:localhost}:${SEAT_DB_PORT:5432}/${SEAT_DB_NAME:seat_db}
    username: ${SEAT_DB_USER}
    password: ${SEAT_DB_PASSWORD}
    hikari:
      connection-timeout: ${SEAT_DB_CONNECTION_TIMEOUT_MS:2000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: seat-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

seat:
  hold:
    ttl: ${SEAT_HOLD_TTL:5m}
    expiry:
      enabled: ${SEAT_HOLD_EXPIRY_ENABLED:true}
      poll-interval: ${SEAT_HOLD_EXPIRY_POLL_INTERVAL:PT5S}
      batch-size: ${SEAT_HOLD_EXPIRY_BATCH_SIZE:100}
      lock-at-most-for: ${SEAT_HOLD_EXPIRY_LOCK_AT_MOST_FOR:PT1M}
      lock-at-least-for: ${SEAT_HOLD_EXPIRY_LOCK_AT_LEAST_FOR:PT1S}
  consumer:
    topic: ${BOOKING_EVENTS_TOPIC:booking-events}
    dlt-topic: booking-events-dlt
    retry:
      max-retries: 4
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info