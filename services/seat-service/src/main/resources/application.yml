spring:
  application:
    name: seat-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seat_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info